services:
  db:
    image: postgres:18-alpine
    container_name: jalsuraksha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jalsuraksha
      POSTGRES_PASSWORD: jalsuraksha_pass_2026
      POSTGRES_DB: water_portal_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalsuraksha -d water_portal_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jalsuraksha-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: jalsuraksha
      DB_PASSWORD: jalsuraksha_pass_2026
      DB_NAME: water_portal_db
      JWT_SECRET: g315_water_portal_capstone_secret_2026
      SMTP_MOCK: "true"
    volumes:
      - uploads_data:/app/backend/uploads

volumes:
  postgres_data:
  uploads_data:
